name: Build and package DuckDB engine plugin

on:
  push:
    branches:
      - foundry
      - repl
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin-new.yml@main
    with:
      # Stable series resolved via mirror/archive.mariadb.org
      mariadb_versions: |
        11.4
        12.3
        13.2
      package_formats: deb
      test_suites: duckdb
      parallel: "4"
      # Quack (MDEV-41383) serves HTTPS through the system OpenSSL
      extra_packages_deb: libssl-dev zlib1g-dev
      extra_packages_rpm: openssl-devel zlib-devel
